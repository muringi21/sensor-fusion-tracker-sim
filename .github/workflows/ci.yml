name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: python -m pip install -U pip maturin pytest numpy matplotlib

      - name: Build wheel
        run: maturin build --release

      - name: Install wheel
        run: python -m pip install --find-links dist sensor-fusion-tracker-sim

      - name: Run tests
        run: pytest -q